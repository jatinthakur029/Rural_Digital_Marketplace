
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rural Digital Market</title>
</head>

<body>

    <div class="market-container">

        <header class="market-header">
            <h1>Rural Digital Market</h1>
            <p>Buy and Sell Agricultural Products</p>
        </header>



        <section class="product-section">

            <h2 class="section-title">Food Grains</h2>

            <div class="product-container">

                <div class="product-card">
                    <img class="product-image" src="./wheat.jpg" alt="Wheat">

                    <div class="product-info">
                        <h3 class="product-name">Wheat</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>


                <div class="product-card">
                    <img class="product-image" src="./Rice.avif" alt="Rice">

                    <div class="product-info">
                        <h3 class="product-name">Rice</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>


                <div class="product-card">
                    <img class="product-image" src="./Maize.jpg" alt="Maize">

                    <div class="product-info">
                        <h3 class="product-name">Maize</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>

            </div>

        </section>



        <section class="product-section">

            <h2 class="section-title">Cash Crops</h2>

            <div class="product-container">

                <div class="product-card">
                    <img class="product-image" src="./Sugarcane.jpg" alt="Sugarcane">

                    <div class="product-info">
                        <h3 class="product-name">Sugarcane</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>


                <div class="product-card">
                    <img class="product-image" src="./Mustard.jpg" alt="Mustard">

                    <div class="product-info">
                        <h3 class="product-name">Mustard</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>


                <div class="product-card">
                    <img class="product-image" src="./Cotton.jpg" alt="Cotton">

                    <div class="product-info">
                        <h3 class="product-name">Cotton</h3>

                        <div class="product-buttons">
                            <button class="buy-btn">Buy</button>
                            <button class="sell-btn">Sell</button>
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </div>
    <br>
<a href="#">About Us</a>
<a href="#">Buy</a>
<a href="#">Sell</a>
<input type="text" placeholder="Enter Your Crop Name">
<button>Search</button>
</body>

</html>
